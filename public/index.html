<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Véradási Helyszínek</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/app.css">
</head>

<body>

    <div id="map"></div>
    <div id="side-panel">
        <div id="section-inspector" class="panel-section" style="display: none;">
            <button id="close-inspector"><i class="fa-solid fa-xmark"></i></button>
            <div id="inspector-content"></div>
        </div>

        <div id="section-filters" class="panel-section collapsible">
            <div class="section-header" id="filters-header">
                <h3>Szűrők</h3>
                <button class="toggle-btn" id="toggle-filters">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
            <div id="filters-content" class="section-content">
                <div class="filter-group" style="margin-top: 15px;">
                    <span style="font-size: 0.95rem; color: #34495e;">Dátum:</span>
                    <select id="filter-date-range" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #dee2e6; margin-top: 5px; font-size: 0.9rem; color: #34495e; cursor: pointer; outline: none;">
                        <option value="anytime">Bármikor</option>
                        <option value="today">Ma</option>
                        <option value="next_workday">Következő munkanap</option>
                        <option value="this_week">A héten</option>
                        <option value="next_week">Következő héten</option>
                    </select>
                </div>
                <div class="filter-group" style="margin-top: 15px;">
                    <span style="font-size: 0.95rem; color: #34495e;">Napok:</span>
                    <div class="day-filters">
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="0" checked><span>H</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="1" checked><span>K</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="2" checked><span>Sze</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="3" checked><span>Cs</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="4" checked><span>P</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="5" checked><span>Szo</span></label>
                        <label class="day-filter"><input type="checkbox" class="filter-day" value="6" checked><span>V</span></label>
                    </div>
                </div>
                <div class="filter-group" style="margin-top: 15px;">
                    <span style="font-size: 0.95rem; color: #34495e;">Időszakok:</span>
                    <div class="interval-filters">
                        <label class="interval-filter"><input type="checkbox" class="filter-interval" value="morning" checked><span>Reggel (8-10)</span></label>
                        <label class="interval-filter"><input type="checkbox" class="filter-interval" value="beforeLunch" checked><span>Délelőtt (10-13)</span></label>
                        <label class="interval-filter"><input type="checkbox" class="filter-interval" value="afterLunch" checked><span>Délután (13-17)</span></label>
                        <label class="interval-filter"><input type="checkbox" class="filter-interval" value="evening" checked><span>Este (17-19)</span></label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="locations.js"></script>

    <script>
        // Initialize the map
        const map = L.map('map').setView([47.1625, 19.5033], 8); // Center of Hungary

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 16,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Custom icon function
        function createCustomIcon(isFixed) {
            const color = isFixed ? "#7f8c8d" : "#c0392b";
            const iconClass = isFixed ? "fa-solid fa-hospital" : "fa-solid fa-ambulance";
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class='marker-pin' style='background-color: ${color};'><i class='${iconClass}' style='color: white;'></i></div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function getMonday(d) {
            d = new Date(d);
            var day = d.getDay(),
                diff = d.getDate() - day + (day == 0 ? -6 : 1); // adjust when day is sunday
            return new Date(d.setDate(diff));
        }

        function getNDaysFromDate(date, n) {
            const result = new Date(date);
            result.setDate(result.getDate() + n);
            return result;
        }

        function renderCalendar(appointments) {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            const currentMonday = getMonday(today);
            const dayLabels = ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'];

            let html = '<div class="calendar-grid">';
            dayLabels.forEach(l => html += `<div class="calendar-header">${l}</div>`);

            for (let i = 0; i < 28; i++) {
                const iDate = getNDaysFromDate(currentMonday, i);
                const iStr = iDate.toISOString().split('T')[0];

                const isToday = iStr === todayStr;
                const hasApp = iStr in appointments;

                let classes = 'calendar-day';

                if (isToday) classes += ' current';
                if (hasApp) classes += ' has-appointment';

                html += `<div class="${classes}"><span>${iDate.getDate()}</span>`
                html += `<span class="hours">${appointments[iStr]?.start || ''}</span>`;
                html += `<span class="hours">${appointments[iStr]?.end || ''}</span>`;
                html += `</div>`;
            }
            html += '</div>';
            return html;
        }

        // Side panel elements
        const filtersHeader = document.getElementById('filters-header');
        const filtersContent = document.getElementById('filters-content');
        const toggleFiltersBtn = document.getElementById('toggle-filters');
        
        const sectionInspector = document.getElementById('section-inspector');
        const inspectorContent = document.getElementById('inspector-content');
        const closeInspectorBtn = document.getElementById('close-inspector');

        const filterDateRange = document.getElementById('filter-date-range');
        const dayFilters = document.querySelectorAll('.filter-day');
        const intervalFilters = document.querySelectorAll('.filter-interval');

        // Functions to manage panel state
        function toggleFilters(forceCollapse) {
            const isCollapsed = forceCollapse === true || (!filtersContent.classList.contains('collapsed') && forceCollapse !== false);
            
            if (isCollapsed) {
                filtersContent.classList.add('collapsed');
                toggleFiltersBtn.classList.add('collapsed');
            } else {
                filtersContent.classList.remove('collapsed');
                toggleFiltersBtn.classList.remove('collapsed');
            }
        }

        filtersHeader.addEventListener('click', () => toggleFilters());

        closeInspectorBtn.addEventListener('click', () => {
            sectionInspector.style.display = 'none';
        });

        // Marker management
        const markersLayer = L.layerGroup().addTo(map);

        function getDatesForRange(range) {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            const currentMonday = getMonday(today);
            
            if (range === 'today') {
                return [todayStr];
            } else if (range === 'next_workday') {
                let d = new Date(today);
                d.setDate(d.getDate() + 1);
                while (d.getDay() === 0 || d.getDay() === 6) {
                    d.setDate(d.getDate() + 1);
                }
                return [d.toISOString().split('T')[0]];
            } else if (range === 'this_week') {
                let dates = [];
                for (let i = 0; i < 7; i++) {
                    dates.push(getNDaysFromDate(currentMonday, i).toISOString().split('T')[0]);
                }
                return dates;
            } else if (range === 'next_week') {
                let dates = [];
                const nextMonday = getNDaysFromDate(currentMonday, 7);
                for (let i = 0; i < 7; i++) {
                    dates.push(getNDaysFromDate(nextMonday, i).toISOString().split('T')[0]);
                }
                return dates;
            }
            return null; // anytime
        }

        function renderMarkers() {
            markersLayer.clearLayers();
            const selectedDays = Array.from(dayFilters).filter(cb => cb.checked).map(cb => parseInt(cb.value));
            const selectedIntervals = Array.from(intervalFilters).filter(cb => cb.checked).map(cb => cb.value);
            const dateRangeDates = getDatesForRange(filterDateRange.value);

            const filtered = LOCATIONS.filter(point => {
                const hasAppointmentMatch = Object.entries(point.appointments).some(([dateStr, app]) => {
                    if (dateRangeDates && !dateRangeDates.includes(dateStr)) return false;
                    const dayMatch = selectedDays.includes(app.dayOfWeek);
                    const intervalMatch = app.intervals.some(interval => selectedIntervals.includes(interval));
                    return dayMatch && intervalMatch;
                });
                return hasAppointmentMatch;
            });

            filtered.forEach(point => {
                const marker = L.marker(point.coords, {
                    icon: createCustomIcon(point.isFixedLocation)
                }).addTo(markersLayer);

                marker.on('click', () => {
                    const content = `
                        <div style="font-family: sans-serif;">
                            <h2 style="margin: 0 0 10px 0; font-size: 20px; color: #333;">${point.name}</h2>
                            <p style="margin: 0 0 20px 0; font-size: 14px; color: #666; line-height: 1.4;">
                                <i class="fa-solid fa-location-dot" style="margin-right: 5px; color: #c0392b;"></i>
                                ${point.address}
                            </p>
                            <div style="font-size: 14px;">
                                <strong style="display: block; margin-bottom: 10px; border-bottom: 2px solid #f1f2f6; padding-bottom: 5px;">Időpontok:</strong>
                                ${renderCalendar(point.appointments)}
                            </div>
                        </div>
                    `;
                    inspectorContent.innerHTML = content;
                    sectionInspector.style.display = 'block';

                    // Collapse filters when marker selected
                    toggleFilters(true);

                    // On mobile, scroll to top of inspector
                    sectionInspector.scrollIntoView({ behavior: 'smooth' });
                });
            });
        }

        filterDateRange.addEventListener('change', renderMarkers);
        dayFilters.forEach(cb => cb.addEventListener('change', renderMarkers));
        intervalFilters.forEach(cb => cb.addEventListener('change', renderMarkers));

        // Initial render
        renderMarkers();
    </script>

</body>

</html>
